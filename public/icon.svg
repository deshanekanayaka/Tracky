<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E74C8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0F4A8A;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0a3060" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect width="128" height="128" rx="28" ry="28" fill="url(#bg)"/>

  <!-- Subtle inner highlight -->
  <rect width="128" height="64" rx="28" ry="28" fill="white" opacity="0.06"/>

  <!-- T letter — horizontal bar -->
  <rect x="26" y="28" width="76" height="14" rx="7" fill="white"/>

  <!-- T letter — vertical bar -->
  <rect x="51" y="28" width="26" height="72" rx="7" fill="white"/>

  <!-- Small accent dot bottom right -->
  <circle cx="96" cy="96" r="8" fill="white" opacity="0.25"/>
  <circle cx="96" cy="96" r="4" fill="white" opacity="0.6"/>
</svg>
